<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>固定宽度格式化器</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: #f0f0f0;
      color: #333;
    }

    /* ── settings ── */
    #bar-settings {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 18px;
      padding: 8px 14px;
      background: #fff;
      border-bottom: 1px solid #ddd;
      flex-shrink: 0;
    }
    .sg { display: flex; align-items: center; gap: 6px; }
    .sg label { white-space: nowrap; }
    input[type=number] {
      width: 66px;
      padding: 3px 5px;
      border: 1px solid #bbb;
      border-radius: 3px;
    }
    .hint { color: #bbb; font-size: 11px; margin-left: 4px; }

    /* ── button bar ── */
    #bar-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: #fff;
      border-bottom: 1px solid #ddd;
      flex-shrink: 0;
    }
    button {
      padding: 4px 13px;
      border: 1px solid #bbb;
      border-radius: 3px;
      background: #f8f8f8;
      cursor: pointer;
      white-space: nowrap;
      font-size: 13px;
    }
    button:hover { background: #e4e4e4; }
    .push-right { margin-left: auto; display: flex; gap: 8px; }

    /* ── panels ── */
    #panels {
      display: flex;
      flex: 1;
      overflow: hidden;
      padding: 8px 14px 6px;
    }
    .panel {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 80px;
      overflow: hidden;
    }
    .panel > span {
      font-size: 11px;
      color: #888;
      padding-bottom: 4px;
      flex-shrink: 0;
    }
    .panel textarea {
      flex: 1;
      min-height: 0;
      font-family: 'NSimSun', 'SimSun', 'Courier New', Consolas, monospace;
      font-size: 13px;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 3px;
      resize: none;
      line-height: 1.65;
      background: #fff;
    }
    #out {
      white-space: pre;
      overflow-x: auto;
      word-break: normal;
      overflow-wrap: normal;
    }

    /* ── splitter ── */
    #splitter {
      flex-shrink: 0;
      width: 7px;
      margin: 0 4px;
      border-radius: 3px;
      background: #ddd;
      cursor: col-resize;
      transition: background 0.15s;
    }
    #splitter:hover, #splitter.active { background: #999; }

    /* ── status bar ── */
    #statusbar {
      flex-shrink: 0;
      padding: 4px 14px;
      font-size: 11px;
      color: #555;
      background: #e0e0e0;
      border-top: 1px solid #ccc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

<div id="bar-settings">
  <div class="sg">
    <label for="v-width">行宽（汉字数）</label>
    <input type="number" id="v-width" value="24" min="2" max="200">
  </div>
  <div class="sg">
    <label for="v-indent">悬挂缩进（字符数）</label>
    <input type="number" id="v-indent" value="3.5" min="0" max="40" step="0.5">
  </div>
  <div class="sg">
    <span>缩进空格</span>
    <label><input type="radio" name="space" value="full" checked> 全角</label>
    <label><input type="radio" name="space" value="half"> 半角</label>
  </div>
  <span class="hint">（标点计 1 列）</span>
</div>

<div id="bar-buttons">
  <button id="btn-format">格式化&emsp;Ctrl+Enter</button>
  <button id="btn-paste">粘贴剪贴板</button>
  <button id="btn-clear">清空</button>
  <div class="push-right">
    <button id="btn-copy">复制输出</button>
    <button id="btn-save">保存为 TXT</button>
  </div>
</div>

<div id="panels">
  <div class="panel" id="panel-in">
    <span>输入</span>
    <textarea id="inp" spellcheck="false"
      placeholder="在此粘贴文字，或点击「粘贴剪贴板」…"></textarea>
  </div>
  <div id="splitter"></div>
  <div class="panel" id="panel-out">
    <span>输出</span>
    <textarea id="out" spellcheck="false" wrap="off"></textarea>
  </div>
</div>

<div id="statusbar">就绪</div>

<script src="formatter.js"></script>
</body>
</html>
